
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATOM Lite GSR Monitor</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

#connectButton {
    background: #1976d2;
    color: white;
}

#disconnectButton {
    background: #d32f2f;
    color: white;
}

button:disabled {
    background: #aaa;
}

.status {
    font-weight: bold;
    margin: 10px 0;
}

.data-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.data-box {
    background: #f0f0f0;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
}

.data-label {
    font-size: 14px;
    color: #666;
}

.data-value {
    font-size: 24px;
    font-weight: bold;
    margin-top: 5px;
}

canvas {
    width: 100%;
    height: 350px;
    border: 1px solid #ccc;
    background: white;
}

#log {
    height: 150px;
    overflow-y: auto;
    background: #111;
    color: #00ff00;
    padding: 10px;
    font-family: monospace;
    font-size: 12px;
}

.info {
    font-size: 13px;
    color: #555;
}

.graph-info {
    text-align: center;
    color: #666;
    margin-bottom: 10px;
    font-size: 14px;
}

</style>
</head>


<body>

<div class="container">

<h1>🧪 ATOM Lite GSR Monitor</h1>


<div class="card">

<h2>Bluetooth</h2>

<button id="connectButton">
🔵 Bluetooth接続
</button>

<button id="disconnectButton" disabled>
🔴 切断
</button>

<div class="status" id="status">
未接続
</div>

</div>



<div class="card">

<h2>リアルタイムGSR</h2>

<div class="graph-info">
直近10秒のRaw GSRを表示
</div>

<canvas id="gsrChart"></canvas>

</div>



<div class="card">

<h2>現在のデータ</h2>

<div class="data-grid">

<div class="data-box">

<div class="data-label">
Raw GSR
</div>

<div class="data-value" id="rawGSR">
---
</div>

</div>


<div class="data-box">

<div class="data-label">
Voltage
</div>

<div class="data-value" id="voltage">
---
</div>

</div>


<div class="data-box">

<div class="data-label">
Elapsed
</div>

<div class="data-value" id="elapsed">
---
</div>

</div>

</div>

</div>



<div class="card">

<h2>通信ログ</h2>

<div id="log"></div>

</div>



<div class="card">

<h2>Bluetooth情報</h2>

<div class="info">

<div>
Device: ATOM_Lite_GSR
</div>

<div>
Service UUID:
4fafc201-1fb5-459e-8fcc-c5c9c331914b
</div>

<div>
Characteristic UUID:
beb5483e-36e1-4688-b7f5-ea07361b26a8
</div>

</div>

</div>

</div>



<script>

/* ==================================================
   Bluetooth settings
================================================== */

const DEVICE_NAME = "ATOM_Lite_GSR";

const SERVICE_UUID =
"4fafc201-1fb5-459e-8fcc-c5c9c331914b";

const CHARACTERISTIC_UUID =
"beb5483e-36e1-4688-b7f5-ea07361b26a8";


let device = null;
let characteristic = null;


/* ==================================================
   Graph settings
================================================== */

/*
   ATOM Lite:
   100 Hz = 100 samples / second

   Display:
   10 seconds × 100 Hz
   = 1000 points
*/

const SAMPLE_RATE = 100;

const DISPLAY_SECONDS = 10;

const MAX_POINTS =
    SAMPLE_RATE * DISPLAY_SECONDS;


let graphData = [];


/* ==================================================
   Canvas
================================================== */

const canvas =
    document.getElementById("gsrChart");

const ctx =
    canvas.getContext("2d");


/* ==================================================
   UI elements
================================================== */

const connectButton =
    document.getElementById("connectButton");

const disconnectButton =
    document.getElementById("disconnectButton");

const status =
    document.getElementById("status");

const rawGSR =
    document.getElementById("rawGSR");

const voltage =
    document.getElementById("voltage");

const elapsed =
    document.getElementById("elapsed");

const log =
    document.getElementById("log");


/* ==================================================
   Log
================================================== */

function addLog(message) {

    const time =
        new Date().toLocaleTimeString();

    log.innerHTML +=
        "[" + time + "] " +
        message +
        "<br>";

    log.scrollTop =
        log.scrollHeight;
}


/* ==================================================
   Bluetooth connect
================================================== */

connectButton.addEventListener(
    "click",
    async function() {

        try {

            status.textContent =
                "Bluetoothデバイスを検索中...";

            addLog(
                "Bluetoothデバイスを検索しています..."
            );


            device =
                await navigator.bluetooth.requestDevice({

                    acceptAllDevices: true,

                    optionalServices:
                        [SERVICE_UUID]

                });


            addLog(
                "選択されたデバイス: " +
                device.name
            );


            device.addEventListener(
                "gattserverdisconnected",
                onDisconnected
            );


            status.textContent =
                "接続中...";


            const server =
                await device.gatt.connect();


            addLog(
                "GATT接続成功"
            );


            const service =
                await server.getPrimaryService(
                    SERVICE_UUID
                );


            characteristic =
                await service.getCharacteristic(
                    CHARACTERISTIC_UUID
                );


            await characteristic.startNotifications();


            characteristic.addEventListener(
                "characteristicvaluechanged",
                handleData
            );


            status.textContent =
                "🟢 接続済み";


            connectButton.disabled =
                true;

            disconnectButton.disabled =
                false;


            addLog(
                "GSRデータ受信開始"
            );

        }

        catch(error) {

            console.error(error);

            status.textContent =
                "接続できませんでした";

            addLog(
                "エラー: " +
                error.message
            );

        }

    }
);


/* ==================================================
   Bluetooth disconnect
================================================== */

disconnectButton.addEventListener(
    "click",
    function() {

        if(
            device &&
            device.gatt.connected
        ) {

            device.gatt.disconnect();

        }

    }
);


function onDisconnected() {

    status.textContent =
        "🔴 切断";

    connectButton.disabled =
        false;

    disconnectButton.disabled =
        true;

    addLog(
        "Bluetooth切断"
    );

}


/* ==================================================
   Receive GSR data
================================================== */

function handleData(event) {

    const decoder =
        new TextDecoder();

    const text =
        decoder.decode(
            event.target.value
        );


    /*
       Example:
       172542,525,0.560
    */

    const parts =
        text.trim().split(",");


    if(parts.length < 3) {

        return;

    }


    const millis =
        parseInt(parts[0]);

    const gsr =
        parseInt(parts[1]);

    const volt =
        parseFloat(parts[2]);


    if(
        isNaN(millis) ||
        isNaN(gsr) ||
        isNaN(volt)
    ) {

        return;

    }


    /* ---------------------------------------------
       Update current values
    --------------------------------------------- */

    rawGSR.textContent =
        gsr;

    voltage.textContent =
        volt.toFixed(3) +
        " V";

    elapsed.textContent =
        (millis / 1000).toFixed(1) +
        " s";


    /* ---------------------------------------------
       Add data to graph
    --------------------------------------------- */

    graphData.push({

        time: millis,

        gsr: gsr

    });


    /*
       Keep only the latest 10 seconds
    */

    if(
        graphData.length >
        MAX_POINTS
    ) {

        graphData.shift();

    }


    drawGraph();

}


/* ==================================================
   Draw graph
================================================== */

function drawGraph() {

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    const width =
        rect.width;

    const height =
        rect.height;


    /* ---------------------------------------------
       Clear
    --------------------------------------------- */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if(graphData.length < 2) {

        ctx.fillStyle =
            "#666";

        ctx.font =
            "16px Arial";

        ctx.fillText(
            "GSRデータを待っています...",
            20,
            30
        );

        return;

    }


    /* ---------------------------------------------
       Y-axis range

       Calculate the recent range.

       Add padding so the waveform does not
       touch the top/bottom.
    --------------------------------------------- */

    let minGSR =
        Math.min(
            ...graphData.map(
                p => p.gsr
            )
        );

    let maxGSR =
        Math.max(
            ...graphData.map(
                p => p.gsr
            )
        );


    let range =
        maxGSR - minGSR;


    /*
       If the signal is very stable,
       use a minimum range.
    */

    if(range < 20) {

        const center =
            (maxGSR + minGSR) / 2;

        minGSR =
            center - 10;

        maxGSR =
            center + 10;

        range = 20;

    }


    /*
       Add 15% padding
    */

    const padding =
        range * 0.15;


    minGSR -= padding;

    maxGSR += padding;


    /* ---------------------------------------------
       Graph margins
    --------------------------------------------- */

    const marginLeft = 55;

    const marginRight = 15;

    const marginTop = 25;

    const marginBottom = 40;


    const graphWidth =
        width -
        marginLeft -
        marginRight;

    const graphHeight =
        height -
        marginTop -
        marginBottom;


    /* ---------------------------------------------
       Horizontal grid
    --------------------------------------------- */

    ctx.strokeStyle =
        "#dddddd";

    ctx.lineWidth = 1;


    for(
        let i = 0;
        i <= 4;
        i++
    ) {

        const y =
            marginTop +
            graphHeight *
            i / 4;


        ctx.beginPath();

        ctx.moveTo(
            marginLeft,
            y
        );

        ctx.lineTo(
            width - marginRight,
            y
        );

        ctx.stroke();


        const value =
            maxGSR -
            (maxGSR - minGSR) *
            i / 4;


        ctx.fillStyle =
            "#555";

        ctx.font =
            "12px Arial";


        ctx.fillText(
            Math.round(value),
            5,
            y + 4
        );

    }


    /* ---------------------------------------------
       Vertical grid

       0, 2.5, 5, 7.5, 10 seconds
    --------------------------------------------- */

    ctx.strokeStyle =
        "#eeeeee";


    for(
        let i = 0;
        i <= 4;
        i++
    ) {

        const x =
            marginLeft +
            graphWidth *
            i / 4;


        ctx.beginPath();

        ctx.moveTo(
            x,
            marginTop
        );

        ctx.lineTo(
            x,
            height - marginBottom
        );

        ctx.stroke();


        const seconds =
            DISPLAY_SECONDS *
            i / 4;


        ctx.fillStyle =
            "#555";

        ctx.font =
            "12px Arial";


        ctx.fillText(
            "-" +
            (DISPLAY_SECONDS - seconds).toFixed(1) +
            " s",
            x - 12,
            height - 15
        );

    }


    /* ---------------------------------------------
       GSR waveform
    --------------------------------------------- */

    ctx.beginPath();


    graphData.forEach(
        (point, index) => {

            const x =
                marginLeft +
                graphWidth *
                index /
                (MAX_POINTS - 1);


            const y =
                marginTop +
                graphHeight *
                (
                    1 -
                    (
                        point.gsr -
                        minGSR
                    ) /
                    (
                        maxGSR -
                        minGSR
                    )
                );


            if(index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            }
            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#1976d2";

    ctx.lineWidth = 2;

    ctx.stroke();


    /* ---------------------------------------------
       Axes
    --------------------------------------------- */

    ctx.strokeStyle =
        "#333";

    ctx.lineWidth = 1;


    ctx.beginPath();

    ctx.moveTo(
        marginLeft,
        marginTop
    );

    ctx.lineTo(
        marginLeft,
        height - marginBottom
    );

    ctx.lineTo(
        width - marginRight,
        height - marginBottom
    );

    ctx.stroke();


    /* ---------------------------------------------
       Labels
    --------------------------------------------- */

    ctx.fillStyle =
        "#555";

    ctx.font =
        "12px Arial";


    ctx.fillText(
        "Raw GSR",
        5,
        15
    );


    ctx.fillText(
        "時間（直近10秒）",
        width - 105,
        height - 15
    );

}


/* ==================================================
   Resize
================================================== */

window.addEventListener(
    "resize",
    drawGraph
);


/* ==================================================
   Initial graph
================================================== */

drawGraph();

</script>

</body>
</html>
```
